spring.application.name=pam
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/pam_database
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enables basic SQL logging in the console and shows the raw SQL statements generated by Hibernate (e.g., SELECT * FROM users), but does not log the actual parameter values—just the queries with placeholders (?).
spring.jpa.show-sql=true
# Formats (pretty-prints) SQL output for better readability. Works only when used with spring.jpa.show-sql=true.
spring.jpa.properties.hibernate.format_sql=true
# Logs actual parameter values to terminal.
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# *********************************************
##### These properties outlined with * are the absolutely necessary properties for Flyway to run migration scripts on startup in a Spring Boot:

# Enables Flyway migrations in the Spring Boot application. Without this, Flyway will not execute migrations at startup.
spring.flyway.enabled=true
#  Specifies where Flyway should look for migration scripts. By default, Flyway checks classpath:db/migration, but explicitly setting it ensures migrations are found.
spring.flyway.locations=classpath:db/migration
# Specifies the database URL to connect to and where Flyway will apply migrations. This is the same URL that Spring Boot uses to connect to the database.
flyway.url=jdbc:postgresql://localhost:5432/pam_database
# Specifies the database user and password that Flyway will use to execute the migration scripts.
flyway.user=postgres
flyway.password=postgres
# *********************************************


# &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&
##### These properties outlined with & are optional and can be used to customize Flyway's behavior:

# Specifies the baseline version for the database. This is useful when you have an existing database and want to start using Flyway to manage it. Flyway will only apply migrations that have a version greater than the baseline version.
spring.flyway.baseline-on-migrate=true
# Enables debug logging for Flyway, useful for troubleshooting but not necessary for migration execution.
logging.level.org.flywaydb=DEBUG
# Specifies the database driver class name. This is necessary when Flyway cannot determine the driver class name from the URL. Generally not needed in a Spring Boot application, as Spring Boot auto-detects the driver based on the database URL. Included here for completeness.
flyway.driver=org.postgresql.Driver
# &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&