services:
  postgres:
    image: postgres:15
    container_name: pam_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pam_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pam_network

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pam_spring_app
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pam_postgres:5432/pam_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - pam_network

volumes:
  postgres_data:

networks:
  pam_network:
